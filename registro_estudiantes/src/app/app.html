<main class="container" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
  <h1 style="text-align: center; margin-bottom: 24px;">Sistema de Registro de Estudiantes</h1>

  <!-- Formulario -->
  <app-formulario-estudiante
    [estudianteParaEditar]="estudianteEditando"
    (guardarEstudiante)="onGuardarEstudiante($event)"
    (cancelarEdicionEvent)="onCancelarEdicion()">
  </app-formulario-estudiante>

  <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;" />

  <!-- Listado -->
  <app-listado-estudiantes
    [estudiantes]="listaEstudiantes"
    (editarEvent)="onEditarEstudiante($event)"
    (eliminarEvent)="onEliminarEstudiante($event)">
  </app-listado-estudiantes>
</main>
